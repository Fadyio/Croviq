<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Croviq Architecture Diagram</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #0b0f19;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
      }
      svg {
        width: 1920px;
        height: 1180px;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="container"></div>
    <script>
      fetch("./diagram.svg")
        .then((res) => res.text())
        .then((svgText) => {
          document.getElementById("container").innerHTML = svgText;
        });
    </script>
  </body>
</html>
