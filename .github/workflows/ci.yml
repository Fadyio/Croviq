name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-infrastructure:
    name: Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify repository structure
        run: |
          test -d apps
          test -d packages
          test -d infra
          test -d docs
          test -f README.md
          test -f docs/ENGINEERING.md

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Validate Infrastructure via Makefile
        run: make infra-validate

  frontend-checks:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY || 'mock-firebase-key-for-ci-build' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN || 'croviq-506602.firebaseapp.com' }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || 'croviq-506602' }}
        run: pnpm -r build
      - name: Typecheck via Makefile
        run: make typecheck

      - name: Lint via Makefile
        run: make lint

      - name: Format check via Makefile
        run: make format-check

  backend-checks:
    name: Backend & Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Setup dependencies via Makefile
        run: |
          pnpm install --frozen-lockfile
          uv sync --directory packages/domain --frozen
          uv sync --directory packages/observability --frozen
          uv sync --directory packages/media --frozen
          uv sync --directory packages/agents --frozen
          uv sync --directory apps/api --frozen

      - name: Run Backend Tests via Makefile
        run: make test

      - name: Run Security Audit via Makefile
        run: make security

      - name: Run Gitleaks Independent Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: true

      - name: Check OpenAPI Drift
        run: |
          make openapi
          git diff --exit-code openapi.json apps/web/src/api/generated.ts

  e2e-browser-test:
    name: Browser E2E (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --directory apps/api --frozen

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm --filter @croviq/web exec playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers and dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @croviq/web exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @croviq/web exec playwright install-deps chromium

      - name: Start Backend API and Frontend Web servers
        env:
          ENVIRONMENT: development
          PORT: 8080
          CROVIQ_ALLOWED_EMAILS: demo@croviq.app,fadynagh10@gmail.com
          API_PROXY_TARGET: http://127.0.0.1:8080
          VITE_FIREBASE_API_KEY: mock-firebase-api-key-for-local-testing
          VITE_FIREBASE_AUTH_DOMAIN: croviq-506602.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: croviq-506602
        run: |
          nohup uv run --directory apps/api uvicorn croviq_api.main:app --host 127.0.0.1 --port 8080 > /tmp/api.log 2>&1 &
          nohup pnpm --filter @croviq/web dev --host 127.0.0.1 --port 5173 > /tmp/web.log 2>&1 &

      - name: Wait for services to be ready
        run: |
          echo "Waiting for http://127.0.0.1:5173 and http://127.0.0.1:8080/api/health..."
          for i in {1..30}; do
            web_ok=0
            api_ok=0
            if curl -sf http://127.0.0.1:5173 > /dev/null 2>&1; then
              web_ok=1
            fi
            if curl -sf http://127.0.0.1:8080/api/health > /dev/null 2>&1; then
              api_ok=1
            fi
            if [ "$web_ok" -eq 1 ] && [ "$api_ok" -eq 1 ]; then
              echo "Services are ready after ${i} seconds!"
              exit 0
            fi
            sleep 1
          done
          echo "Timed out waiting for services to be ready."
          echo "=== Backend API Log ==="
          cat /tmp/api.log || true
          echo "=== Frontend Web Log ==="
          cat /tmp/web.log || true
          exit 1

      - name: Run Sharded E2E tests
        run: pnpm --filter @croviq/web exec playwright test --shard=${{ matrix.shard }}

      - name: Stop Background Services
        if: always()
        run: |
          pkill -f "uvicorn" || true
          pkill -f "vite" || true

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ strategy.job-index }}
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 7
