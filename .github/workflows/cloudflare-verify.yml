name: Cloudflare Terraform Auth Verification

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  verify-cloudflare-auth:
    name: Verify Cloudflare Terraform Auth
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check GitHub Secret Availability
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "GITHUB_SECRET_AVAILABLE=YES" >> $GITHUB_ENV
            echo "CLOUDFLARE_API_TOKEN secret is present in repository secrets."
          else
            echo "GITHUB_SECRET_AVAILABLE=NO" >> $GITHUB_ENV
            echo "::error::CLOUDFLARE_API_TOKEN secret is MISSING."
            exit 1
          fi

      - name: Authenticate to Google Cloud via WIF (Remote State Access)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/705994694330/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider"
          service_account: "croviq-github-deployer@croviq-506602.iam.gserviceaccount.com"
          token_format: "access_token"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Terraform Cloudflare DNS Init
        working-directory: infra/cloudflare-dns
        run: |
          terraform init \
            -backend-config="bucket=croviq-506602-croviq-tfstate" \
            -backend-config="prefix=croviq/cloudflare-dns"

      - name: Terraform Cloudflare DNS Validate
        working-directory: infra/cloudflare-dns
        run: terraform validate

      - name: Terraform Cloudflare DNS Plan (Read-Only Verification)
        id: tf_plan
        working-directory: infra/cloudflare-dns
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "Running terraform plan for infra/cloudflare-dns..."
          terraform plan \
            -detailed-exitcode \
            -no-color \
            -out=tfplan || PLAN_EXIT=$?

          EXIT_CODE=${PLAN_EXIT:-0}
          echo "PLAN_EXIT_CODE=${EXIT_CODE}" >> $GITHUB_ENV
          if [ "$EXIT_CODE" -eq 1 ]; then
            echo "::error::Terraform plan failed with an error."
            exit 1
          elif [ "$EXIT_CODE" -eq 2 ]; then
            echo "::warning::Terraform plan detected differences/changes (exit code 2)."
          else
            echo "Terraform plan succeeded with 0 changes (exit code 0)."
          fi

      - name: Verify Token Scope and Read DNS Records
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "=========================================="
          echo "Verifying Cloudflare Token Scope (Read-Only)"
          echo "=========================================="

          echo "1. Querying Zone 'croviq.app' via Cloudflare API..."
          ZONE_RESP=$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/zones?name=croviq.app")
          ZONE_SUCCESS=$(echo "$ZONE_RESP" | jq -r '.success')
          if [ "$ZONE_SUCCESS" != "true" ]; then
            echo "::error::Cloudflare zone query failed: $ZONE_RESP"
            exit 1
          fi

          ZONE_ID=$(echo "$ZONE_RESP" | jq -r '.result[0].id')
          ZONE_NAME=$(echo "$ZONE_RESP" | jq -r '.result[0].name')
          ZONE_STATUS=$(echo "$ZONE_RESP" | jq -r '.result[0].status')
          echo "Zone Name: ${ZONE_NAME}"
          echo "Zone ID: ${ZONE_ID}"
          echo "Zone Status: ${ZONE_STATUS}"

          echo "2. Querying DNS Records for 'app.croviq.app'..."
          DNS_RESP=$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records?name=app.croviq.app")
          DNS_SUCCESS=$(echo "$DNS_RESP" | jq -r '.success')
          if [ "$DNS_SUCCESS" != "true" ]; then
            echo "::error::Cloudflare DNS record query failed: $DNS_RESP"
            exit 1
          fi

          RECORD_COUNT=$(echo "$DNS_RESP" | jq -r '.result | length')
          echo "Found ${RECORD_COUNT} DNS record(s) for app.croviq.app:"
          echo "$DNS_RESP" | jq -r '.result[] | " - \(.type) \(.name) -> \(.content) (proxied: \(.proxied), ttl: \(.ttl), id: \(.id))"'

          echo "3. Querying All Zone DNS Records (Read Scope Verification)..."
          ALL_DNS_RESP=$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records?per_page=50")
          ALL_DNS_COUNT=$(echo "$ALL_DNS_RESP" | jq -r '.result | length')
          echo "Total DNS records readable in zone: ${ALL_DNS_COUNT}"

          echo "=========================================="
          echo "Verification Complete."
          echo "=========================================="
