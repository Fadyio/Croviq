name: Cloudflare DNS Apply

on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: "Git commit SHA to apply (defaults to HEAD)"
        required: false
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: cloudflare-dns-production
  cancel-in-progress: false

jobs:
  cloudflare-dns-apply:
    name: Cloudflare DNS Terraform Apply
    runs-on: ubuntu-latest

    steps:
      - name: Resolve Target Commit SHA
        id: resolve-commit
        run: |
          if [ -n "${{ github.event.inputs.git_sha }}" ]; then
            echo "sha=${{ github.event.inputs.git_sha }}" >> $GITHUB_OUTPUT
          else
            echo "sha=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve-commit.outputs.sha }}

      - name: Check GitHub Secret Availability
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "CLOUDFLARE_API_TOKEN secret is present in repository secrets."
          else
            echo "::error::CLOUDFLARE_API_TOKEN secret is MISSING."
            exit 1
          fi

      - name: Authenticate to Google Cloud via WIF (Remote State Access)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/705994694330/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider"
          service_account: "croviq-github-deployer@croviq-506602.iam.gserviceaccount.com"
          token_format: "access_token"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Terraform Cloudflare DNS Init
        working-directory: infra/cloudflare-dns
        run: |
          terraform init \
            -backend-config="bucket=croviq-506602-croviq-tfstate" \
            -backend-config="prefix=croviq/cloudflare-dns"

      - name: Terraform Cloudflare DNS Validate
        working-directory: infra/cloudflare-dns
        run: terraform validate

      - name: Terraform Cloudflare DNS Plan
        id: tf_plan
        working-directory: infra/cloudflare-dns
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "=========================================="
          echo "Generating Terraform execution plan for infra/cloudflare-dns..."
          echo "=========================================="
          terraform plan -no-color \
            -var="certificate_root_dns_authorization_name=_acme-challenge.croviq.app." \
            -var="certificate_root_dns_authorization_type=CNAME" \
            -var="certificate_root_dns_authorization_value=d042208d-d501-43cd-90bb-1aa6ca6d0cb0.10.authorize.certificatemanager.goog." \
            -out=tfplan

      - name: Terraform Cloudflare DNS Show Plan
        working-directory: infra/cloudflare-dns
        run: |
          echo "=========================================="
          echo "Inspecting planned changes for infra/cloudflare-dns..."
          echo "=========================================="
          terraform show -no-color tfplan

      - name: Terraform Cloudflare DNS Apply
        working-directory: infra/cloudflare-dns
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "=========================================="
          echo "Applying Terraform plan for infra/cloudflare-dns..."
          echo "=========================================="
          terraform apply -no-color -auto-approve tfplan
