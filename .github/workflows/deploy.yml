name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - main
  workflow_dispatch:
    inputs:
      git_sha:
        description: "Git commit SHA to deploy (defaults to HEAD)"
        required: false
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: deployment-production
  cancel-in-progress: false

jobs:
  deploy-app:
    name: Deploy Application Runtime
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    outputs:
      api_service_url: ${{ steps.tf_outputs.outputs.api_service_url }}
      api_service_name: ${{ steps.tf_outputs.outputs.api_service_name }}
      api_revision: ${{ steps.tf_outputs.outputs.api_revision }}
      web_service_name: ${{ steps.tf_outputs.outputs.web_service_name }}
      web_revision: ${{ steps.tf_outputs.outputs.web_revision }}
      load_balancer_ip: ${{ steps.tf_outputs.outputs.load_balancer_ip }}
      git_sha: ${{ steps.resolve-commit.outputs.sha }}
    steps:
      - name: Resolve Target Commit SHA
        id: resolve-commit
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ github.event.inputs.git_sha }}" ]; then
            echo "sha=${{ github.event.inputs.git_sha }}" >> $GITHUB_OUTPUT
          else
            echo "sha=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve-commit.outputs.sha }}

      - name: Authenticate to Google Cloud via WIF
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/705994694330/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider"
          service_account: "croviq-github-deployer@croviq-506602.iam.gserviceaccount.com"
          token_format: "access_token"

      - name: Authenticate Docker to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: "us-central1-docker.pkg.dev"
          username: "oauth2accesstoken"
          password: "${{ steps.auth.outputs.access_token }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Production API Image
        id: docker_build_api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            us-central1-docker.pkg.dev/croviq-506602/croviq-api/croviq-api:${{ steps.resolve-commit.outputs.sha }}
            us-central1-docker.pkg.dev/croviq-506602/croviq-api/croviq-api:latest

      - name: Build and Push Production Web Image
        id: docker_build_web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            us-central1-docker.pkg.dev/croviq-506602/croviq-web/croviq-web:${{ steps.resolve-commit.outputs.sha }}
            us-central1-docker.pkg.dev/croviq-506602/croviq-web/croviq-web:latest

      - name: Record Container Metadata
        id: meta
        run: |
          API_DIGEST="${{ steps.docker_build_api.outputs.digest }}"
          API_IMAGE_URI="us-central1-docker.pkg.dev/croviq-506602/croviq-api/croviq-api@${API_DIGEST}"
          WEB_DIGEST="${{ steps.docker_build_web.outputs.digest }}"
          WEB_IMAGE_URI="us-central1-docker.pkg.dev/croviq-506602/croviq-web/croviq-web@${WEB_DIGEST}"
          echo "api_digest=${API_DIGEST}" >> $GITHUB_OUTPUT
          echo "api_image_uri=${API_IMAGE_URI}" >> $GITHUB_OUTPUT
          echo "web_digest=${WEB_DIGEST}" >> $GITHUB_OUTPUT
          echo "web_image_uri=${WEB_IMAGE_URI}" >> $GITHUB_OUTPUT
          echo "=========================================="
          echo "Git SHA: ${{ steps.resolve-commit.outputs.sha }}"
          echo "API Image Digest: ${API_DIGEST}"
          echo "API Immutable URI: ${API_IMAGE_URI}"
          echo "Web Image Digest: ${WEB_DIGEST}"
          echo "Web Immutable URI: ${WEB_IMAGE_URI}"
          echo "=========================================="

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Terraform Init
        working-directory: infra
        run: |
          terraform init \
            -backend-config="bucket=croviq-506602-croviq-tfstate" \
            -backend-config="prefix=croviq/main"

      - name: Terraform Plan
        id: tf_plan
        working-directory: infra
        run: |
          terraform plan \
            -var="project_id=croviq-506602" \
            -var="region=us-central1" \
            -var="environment=prod" \
            -var="api_image=${{ steps.meta.outputs.api_image_uri }}" \
            -var="web_image=${{ steps.meta.outputs.web_image_uri }}" \
            -var="git_sha=${{ steps.resolve-commit.outputs.sha }}" \
            -out=tfplan

      - name: Terraform Apply
        id: tf_apply
        working-directory: infra
        run: |
          terraform apply -auto-approve tfplan

      - name: Capture Outputs
        id: tf_outputs
        working-directory: infra
        run: |
          API_URL=$(terraform output -raw cloud_run_url)
          API_NAME=$(terraform output -raw cloud_run_service_name)
          API_REV=$(terraform output -raw cloud_run_latest_revision)
          WEB_NAME=$(terraform output -raw web_cloud_run_service_name)
          WEB_REV=$(terraform output -raw web_cloud_run_latest_revision)
          LB_IP=$(terraform output -raw load_balancer_ip)
          DNS_AUTH_NAME=$(terraform output -raw dns_authorization_record_name)
          DNS_AUTH_TYPE=$(terraform output -raw dns_authorization_record_type)
          DNS_AUTH_VALUE=$(terraform output -raw dns_authorization_record_value)
          echo "api_service_url=${API_URL}" >> $GITHUB_OUTPUT
          echo "api_service_name=${API_NAME}" >> $GITHUB_OUTPUT
          echo "api_revision=${API_REV}" >> $GITHUB_OUTPUT
          echo "web_service_name=${WEB_NAME}" >> $GITHUB_OUTPUT
          echo "web_revision=${WEB_REV}" >> $GITHUB_OUTPUT
          echo "load_balancer_ip=${LB_IP}" >> $GITHUB_OUTPUT
          echo "=========================================="
          echo "API Cloud Run: ${API_NAME} (${API_REV}) -> ${API_URL}"
          echo "Web Cloud Run: ${WEB_NAME} (${WEB_REV})"
          echo "Load Balancer Global IP: ${LB_IP}"
          echo "DNS Auth Record: ${DNS_AUTH_NAME} ${DNS_AUTH_TYPE} ${DNS_AUTH_VALUE}"
          echo "=========================================="

      - name: Set up Cloud SDK for Read-Only Inspection
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify Live Cloud Run API Health
        run: |
          SERVICE_URL="${{ steps.tf_outputs.outputs.api_service_url }}"
          echo "Testing live health endpoint: ${SERVICE_URL}/api/health"
          RESPONSE=$(curl -fsS -i -H "x-request-id: deploy-verify-${{ steps.resolve-commit.outputs.sha }}" "${SERVICE_URL}/api/health")
          echo "$RESPONSE"
