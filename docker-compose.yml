services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: croviq-web
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/node_modules
    environment:
      - NODE_ENV=development
      - API_PROXY_TARGET=http://croviq-api:8080
      - VITE_FIREBASE_API_KEY=AIzaSyDummyClientKeyForLocalTesting00
      - VITE_FIREBASE_AUTH_DOMAIN=croviq-506602.firebaseapp.com
      - VITE_FIREBASE_PROJECT_ID=croviq-506602
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api.dev
    container_name: croviq-api
    ports:
      - "8080:8080"
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages/domain:/app/packages/domain
      - ./packages/observability:/app/packages/observability
      - ./packages/media:/app/packages/media
      - ./packages/agents:/app/packages/agents
      - /app/apps/api/.venv
    environment:
      - ENVIRONMENT=development
      - PORT=8080
      - CROVIQ_ALLOWED_EMAILS=fadynagh10@gmail.com
    restart: unless-stopped
