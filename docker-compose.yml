services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: croviq-web
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/node_modules
    environment:
      - NODE_ENV=development
      - API_PROXY_TARGET=http://croviq-api:8080
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api.dev
    container_name: croviq-api
    ports:
      - "8080:8080"
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages/domain:/app/packages/domain
      - /app/apps/api/.venv
    environment:
      - ENVIRONMENT=development
      - PORT=8080
    restart: unless-stopped
