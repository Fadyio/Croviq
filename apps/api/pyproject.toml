[project]
name = "croviq-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "croviq-domain",
    "fastapi>=0.115.0",
    "pydantic>=2.10.0",
    "uvicorn>=0.34.0",
]

[tool.uv.sources]
croviq-domain = { path = "../../packages/domain", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
]
