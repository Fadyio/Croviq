[project]
name = "croviq-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "croviq-domain",
    "croviq-observability",
    "croviq-media",
    "croviq-agents",
    "fastapi>=0.115.0",
    "firebase-admin>=7.5.0",
    "google-api-core<2.35.0",
    "google-cloud-aiplatform>=1.111.0",
    "google-cloud-storage>=2.18.0",
    "pydantic>=2.10.0",
    "uvicorn>=0.34.0",
    "google-genai>=2.20.0",
    "pydantic-settings>=2.15.0",
]

[tool.uv.sources]
croviq-domain = { path = "../../packages/domain", editable = true }
croviq-observability = { path = "../../packages/observability", editable = true }
croviq-media = { path = "../../packages/media", editable = true }
croviq-agents = { path = "../../packages/agents", editable = true }
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
]
